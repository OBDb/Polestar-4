    description: "The Polestar 4 is a battery electric compact luxury crossover SUV marketed by Polestar since 2023. Positioned between the smaller Polestar 2 and larger Polestar 3, it belongs to the D-segment size segmentation. Unveiled in April 2023 at Auto Shanghai, production began in November 2023 at Geely's factory in Hangzhou Bay, China. The vehicle is built on Geely's Sustainable Experience Architecture (SEA) platform, shared with the Volvo EX30 and Zeekr 001. Most notably, the Polestar 4 eliminates the traditional rear window entirely, using a roof-mounted camera system instead. Available in two powertrain options: Single Motor RWD with 272 horsepower, and Dual Motor AWD with 544 horsepower and 506 lb-ft of torque, capable of 0-62 mph in 3.8 seconds. Both variants use a 102 kWh nickel manganese cobalt battery with 200 kW DC fast-charging (10-80% in under 30 minutes) and 22 kW AC charging. The interior features a 15.4-inch Android Automotive touchscreen, 10.2-inch digital instrument cluster, and available head-up display. A full-length glass roof and digital rear-view mirror are standard. Interior materials use 100% recycled polyester. The vehicle became available in Europe, Canada, and Asia-Pacific from 2024, with additional production starting in South Korea (Busan) from H2 2025 via Renault Korea."
